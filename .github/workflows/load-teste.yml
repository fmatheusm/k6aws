name: K6 load test
on: [push]
jobs:
  k6LoadTeste:
    runs-on: ubuntu-latest
    steps:
      - name: step 1 - checkout
        uses: actions/checkout@v4

      - name: step 2 - install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg2
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: step 3 - run k6 load test
        uses: grafana/run-k6-action@v1
        with:
          path: scripts/cloud_stress_teste_search.js

      - name: step 4 - create folder for report
        run: ls & mkdir report & mv index.html report

      - name: step 5 - upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relatorio de testes de performance
          path: report
